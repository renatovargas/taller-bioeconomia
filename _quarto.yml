project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - "*.qmd"
    - "materiales/**/*.qmd"
    - "slides/**/*.qmd"
    - "!refs/"
  resources:
    - data/indec-cou/
    - data/bd/ARG_SCN_BD_2023.xlsx
    - data/config/
    - data/salidas/ARG_cuadros_bioeconomia_2023.xlsx
    - scripts/01-procesar-cou-argentina.R
    - scripts/02-cuadros-y-resultados.R
    - scripts/funciones-presentacion.R
    - assets/
    - .nojekyll

website:
  title: "Taller de bioeconomía"
  description: "Cuentas temáticas de bioeconomía: método y aplicación al cuadro de oferta y utilización de Argentina"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: materiales/index.qmd
        text: Materiales
      - href: materiales/clasificacion.qmd
        text: Clasificación
      - href: materiales/descargas.qmd
        text: Descargas
      - href: about.qmd
        text: Acerca de
    right:
      - href: https://01a1cbe7-8fae-9e7f-3fdc-9194f74a648a.share.connect.posit.cloud/
        text: Herramienta
        icon: box-arrow-up-right
        target: _blank
  sidebar:
    - title: Materiales
      style: docked
      search: false
      contents:
        - text: "Materiales"
          href: materiales/index.qmd
        - section: Presentaciones
          contents:
            - materiales/presentaciones/01-bioeconomia-cuentas-nacionales.qmd
            - materiales/presentaciones/02-cuadros-oferta-utilizacion.qmd
            - materiales/presentaciones/03-hallazgos-politica-publica.qmd
        - section: Documentos
          contents:
            - text: "Bioeconomía y política pública en Argentina"
              href: materiales/documentos/bioeconomia-argentina-politica-publica/index.qmd
        - text: "Clasificación de productos y actividades"
          href: materiales/clasificacion.qmd
        - text: "Descargas y scripts"
          href: materiales/descargas.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: styles.css
    toc: true
    lang: es
